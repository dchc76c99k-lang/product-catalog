<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="产品目录 - 精选好货">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>品牌精选</title>
  <!-- 衬线字体（离线时自动回退到系统衬线） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- QR 码生成库（本地，不依赖网络） -->

</head>

    <div class="breadcrumb" id="breadcrumb"></div>
  </header>

  <!-- 主内容区 -->
  <main id="app">
    <!-- 由 JS 动态渲染 -->
  </main>

    </svg>
    <span class="wa-fab-badge">1</span>
  </div>

      <button class="wa-modal-close" id="waModalClose">&times;</button>
      <div class="wa-modal-header">

      <div class="qr-code-box" id="qrCodeBox"></div>
      <p class="wa-number" id="waNumber"></p>
      <a href="#" id="waChatBtn" class="wa-chat-btn" target="_blank" rel="noopener">

        </svg>
        发消息给我
      </a>
    </div>
  </div>

  <!-- 图片放大查看 -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-info" id="lightboxInfo"></div>
  </div>

  <!-- 页脚 -->
  <footer id="footer">
    <p id="footerText"></p>
  </footer>

  <script src="config.js?v=2026082117"></script>
  <script src="app.js?v=2026082117"></script>

</html>
